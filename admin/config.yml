# =====================================================================
# Configuração do painel /admin — Siqueira & Sousa Advogados
#
# O login usa o próprio provedor OAuth do Netlify (não precisa de
# Cloudflare Worker). Basta registrar um OAuth App no GitHub com a
# callback https://api.netlify.com/auth/done e cadastrar o Client
# ID/Secret em Project configuration > Access & security > OAuth,
# no painel do Netlify.
# =====================================================================

backend:
  name: github
  repo: escritoriosiqueirasousaadv/site-escritorio
  branch: main

site_url: https://gorgeous-yeot-30a63f.netlify.app

media_folder: "assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "posts"
    label: "Textos do blog"
    label_singular: "Texto"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: title
    fields:
      - { name: "id", label: "Identificador (sem espaços/acentos)", widget: "string", hint: "Usado só no link do texto. Ex: guarda-compartilhada" }
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", type: "date", format: "YYYY-MM-DD" }
      - { name: "dateLabel", label: "Data (como aparece no site)", widget: "string", hint: "Ex: 01 ago 2026" }
      - { name: "excerpt", label: "Resumo (1 a 2 frases)", widget: "text" }
      - { name: "body", label: "Texto completo", widget: "markdown", buttons: ["bold", "italic", "link"], modes: ["rich_text"] }
